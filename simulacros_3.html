}
function buildNav(){
 navgrid.innerHTML='';exams[currentExam].questions.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{currentIndex=i;renderQuestion()};navgrid.appendChild(b)});
}
function renderQuestion(){
 const qs=exams[currentExam].questions,q=qs[currentIndex];qnum.textContent=`Pregunta ${currentIndex+1} de ${qs.length}`;qtext.textContent=q.q;options.innerHTML='';
 q.opts.forEach((opt,i)=>{const label=document.createElement('label');label.className='option'+(answers[currentIndex]===i?' selected':'');const input=document.createElement('input');input.type='radio';input.name='q';input.checked=answers[currentIndex]===i;input.onchange=()=>{answers[currentIndex]=i;renderQuestion()};label.appendChild(input);label.appendChild(document.createTextNode(String.fromCharCode(65+i)+'. '+opt));options.appendChild(label)});
 const answered=answers.filter(v=>v!==null).length;progressText.textContent=`Avance: ${currentIndex+1}/${qs.length}`;answeredText.textContent=`Respondidas: ${answered}/${qs.length}`;bar.style.width=((answered/qs.length)*100)+'%';
 [...navgrid.children].forEach((b,i)=>{b.classList.toggle('answered',answers[i]!==null);b.classList.toggle('current',i===currentIndex)});
 document.getElementById('prev').disabled=currentIndex===0;document.getElementById('next').disabled=currentIndex===qs.length-1;
}
document.getElementById('prev').onclick=()=>{if(currentIndex>0){currentIndex--;renderQuestion()}};
document.getElementById('next').onclick=()=>{if(currentIndex<exams[currentExam].questions.length-1){currentIndex++;renderQuestion()}};
document.getElementById('backHome').onclick=renderHome;document.getElementById('finish').onclick=finishExam;

function finishExam(){
 const qs=exams[currentExam].questions;let correct=0;const byLesson={};
 qs.forEach((q,i)=>{const ok=answers[i]===q.a;if(ok)correct++;const key=q.lesson||'Sin lección';if(!byLesson[key])byLesson[key]={total:0,correct:0};byLesson[key].total++;if(ok)byLesson[key].correct++});
 const pct=Math.round(correct*100/qs.length),semClass=pct>=80?'green':pct>=60?'yellow':'red';
 let rows='';Object.entries(byLesson).forEach(([k,v])=>{const p=Math.round(v.correct*100/v.total);rows+=`<tr><td>${k}</td><td>${v.correct}/${v.total}</td><td>${p}%</td></tr>`});
 let review='';qs.forEach((q,i)=>{const ans=answers[i],ok=ans===q.a;review+=`<div class="reviewItem ${ok?'right':'wrong'}"><strong>${i+1}. ${q.q}</strong><br><span class="small muted">Tu respuesta: ${ans===null?'Sin responder':String.fromCharCode(65+ans)+'. '+q.opts[ans]}</span><br><span class="small">Correcta: ${String.fromCharCode(65+q.a)}. ${q.opts[q.a]}</span></div>`});
 results.innerHTML=`<h2>${exams[currentExam].name} — Resultados</h2><div class="grid2"><div class="stat"><div class="muted small">Puntaje</div><div class="score">${correct}/${qs.length}</div></div><div class="stat"><div class="muted small">Porcentaje</div><div class="score">${pct}%</div><span class="sem ${semClass}">${pct>=80?'Buen dominio':pct>=60?'Reforzar':'Repasar'}</span></div></div><h3>Resumen por lección</h3><table><thead><tr><th>Lección</th><th>Aciertos</th><th>%</th></tr></thead><tbody>${rows}</tbody></table><div class="controls" style="padding-left:0"><button class="primary" onclick="startExam(currentExam)">Reintentar examen</button><button class="secondary" onclick="renderHome()">Volver al menú</button></div><h3>Revisión completa</h3>${review}`;
 examEl.classList.add('hidden');results.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});
}
renderHome();
</script>
