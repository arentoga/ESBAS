        }

            border: none;

            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;

        }

            background: #444;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        .btn-secondary:hover {
            background: #222;
        }

            display: none;
            margin-top: 30px;
            border-top: 2px solid #ddd;
            padding-top: 25px;
        }
        .result-box.show {
            display: block;
        }

            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;

            text-align: center;
        }

            color: #b31b1b;
        }
        .score-item .label {
            font-size: 0.9rem;
            color: #555;
        }

            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

            border-radius: 8px;

        }

        }

            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 0.85rem;

    // ============================================================
    //  RENDERIZADO Y LÓGICA DEL EXAMEN
    // ============================================================
    const examenDiv = document.getElementById('examen');
    const resultadosDiv = document.getElementById('resultados');

    function renderExamen() {
        let html = '';
        preguntas.forEach((p, idx) => {
            const num = idx + 1;
            html += `<div class="question-block" data-id="${p.id}">
                        <div class="q-tag">${p.leccion} · ${p.tema}</div>
                        <div class="q-title">${num}. ${p.pregunta}</div>
                        <div class="options">`;
            const letras = ['A', 'B', 'C', 'D'];
            p.opciones.forEach((opt, oi) => {
                const value = oi;
                html += `<label>
                            <input type="radio" name="q${p.id}" value="${value}">
                            <span><strong>${letras[oi]}.</strong> ${opt}</span>
                         </label>`;
            });
            html += `</div></div>`;
        });
        examenDiv.innerHTML = html;
    }

    function calificar() {
        let correctas = 0;
        let total = preguntas.length;
        let resultadosPorLeccion = {};

        // Inicializar contadores por lección
        preguntas.forEach(p => {
            if (!resultadosPorLeccion[p.leccion]) {
                resultadosPorLeccion[p.leccion] = { total: 0, correctas: 0 };
            }
            resultadosPorLeccion[p.leccion].total++;
        });

        // Recorrer preguntas y verificar respuestas
        preguntas.forEach(p => {
            const radios = document.querySelectorAll(`input[name="q${p.id}"]`);
            let seleccionado = null;
            radios.forEach(r => { if (r.checked) seleccionado = parseInt(r.value); });
            const esCorrecta = (seleccionado === p.respuesta);
            if (esCorrecta) {
                correctas++;
                resultadosPorLeccion[p.leccion].correctas++;
            }
        });

        const porcentaje = Math.round((correctas / total) * 100);

        // Mostrar resultados
        resultadosDiv.innerHTML = '';
        resultadosDiv.className = 'result-box show';

        let resumenHTML = `
            <div class="score-summary">
                <div class="score-item"><span class="number">${correctas}</span><div class="label">Respuestas correctas</div></div>
                <div class="score-item"><span class="number">${total - correctas}</span><div class="label">Respuestas incorrectas</div></div>
                <div class="score-item"><span class="number">${porcentaje}%</span><div class="label">Porcentaje de acierto</div></div>
            </div>
            <h3>📊 Feedback por lección</h3>
            <p style="color:#555; margin-bottom:12px;">Las lecciones con menos del 70% de acierto requieren repaso.</p>
            <div class="leccion-feedback">
        `;

        let leccionesOrdenadas = Object.keys(resultadosPorLeccion).sort();
        leccionesOrdenadas.forEach(leccion => {
            const datos = resultadosPorLeccion[leccion];
            const pct = Math.round((datos.correctas / datos.total) * 100);
            const repaso = pct < 70;
            const clase = repaso ? 'leccion-card repaso' : 'leccion-card';
            resumenHTML += `
                <div class="${clase}">
                    <div class="nombre">${leccion}</div>
                    <div class="stats">${datos.correctas}/${datos.total} correctas (${pct}%) ${repaso ? '🔴 Repasar' : '✅ OK'}</div>
                </div>
            `;
        });

        resumenHTML += `</div>`;

        // Revisión de respuestas (solo las incorrectas)
        resumenHTML += `<div class="review-answers"><h3>🔍 Revisión de respuestas</h3>`;
        preguntas.forEach((p, idx) => {
            const num = idx + 1;
            const radios = document.querySelectorAll(`input[name="q${p.id}"]`);
            let seleccionado = null;
            radios.forEach(r => { if (r.checked) seleccionado = parseInt(r.value); });
            const esCorrecta = (seleccionado === p.respuesta);
            if (!esCorrecta) {
                const tuResp = (seleccionado !== null) ? p.opciones[seleccionado] : 'No respondida';
                const correcta = p.opciones[p.respuesta];
                resumenHTML += `
                    <div class="respuesta-item">
                        <span><strong>${num}.</strong> ${p.pregunta.substring(0, 80)}${p.pregunta.length > 80 ? '…' : ''}</span>
                        <span class="incorrecta">❌ Tu respuesta: ${tuResp}</span>
                        <span class="correcta">✅ Correcta: ${correcta}</span>
                        <span style="font-size:0.8rem; color:#888;"> (${p.leccion})</span>
                    </div>
                `;
            }
        });
        resumenHTML += `</div>`;

        // Botón para volver a intentar
        resumenHTML += `<div style="text-align:center; margin-top:20px;">
                            <button class="btn btn-secondary" onclick="window.location.reload()">🔄 Intentar de nuevo</button>
                        </div>`;

        resultadosDiv.innerHTML = resumenHTML;

        // Desplazar hacia resultados
        resultadosDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function reiniciar() {
        // Desmarcar todos los radio buttons
        document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
        resultadosDiv.className = 'result-box';
        resultadosDiv.innerHTML = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Eventos
    document.getElementById('btnCalificar').addEventListener('click', calificar);
    document.getElementById('btnReiniciar').addEventListener('click', reiniciar);

    // Renderizar al cargar
    renderExamen();
</script>
